# default.conf corrigé pour Docker Compose

# Résolveur DNS interne Docker
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name vps119521.serveur-vps.net;

    root /var/www/public;
    index index.php index.html;

    # Route principale Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Traitement des fichiers PHP
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;  # Utiliser le nom exact du container app
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Proxy vers le service Reverb
    location /app {
        proxy_pass http://lpdmanager_reverb:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Bloquer les fichiers cachés
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Mise en cache des fichiers statiques
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires max;
        log_not_found off;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
