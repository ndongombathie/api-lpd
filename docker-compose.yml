version: "3.8"

services:
  app:
    build: .
    container_name: laravel_app
    volumes:
      - ./:/var/www
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: laravel_web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx:/etc/nginx/conf.d
    networks:
      - laravel

  db:
    image: mysql:8
    container_name: laravel_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    networks:
      - laravel

  reverb:
    build: .
    container_name: laravel_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
    depends_on:
      - app
    networks:
      - laravel

  queue:
    build: .
    container_name: laravel_queue
    command: php artisan queue:work
    volumes:
      - ./:/var/www
    depends_on:
      - app
    networks:
      - laravel

networks:
  laravel:
